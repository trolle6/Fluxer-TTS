# Template for TrueNAS Custom App (no secrets). See truenas-app.local.yml on your PC.

services:
  fluxer:
    image: ghcr.io/trolle6/fluxer-tts:latest
    platform: linux/amd64
    pull_policy: always
    restart: on-failure:3
    privileged: false
    stdin_open: false
    tty: false
    group_add:
      - 568
    environment:
      NVIDIA_VISIBLE_DEVICES: void
      TZ: Europe/Stockholm
      DATA_ROOT: /app/Data
      FLUXER_BOT_TOKEN: "YOUR_TOKEN"
      OPENAI_API_KEY: "YOUR_OPENAI_KEY"
      FLUXER_LOG_CHANNEL_ID: "YOUR_LOG_CHANNEL"
      FLUXER_MODERATOR_ROLE_ID: "YOUR_MOD_ROLE"
      TTS_CHANNEL_ID: "YOUR_TTS_CHANNEL"
      TTS_ROLE_ID: "YOUR_TTS_ROLE"
    volumes:
      - /mnt/YOURPOOL/apps/fluxer/data:/app/Data
