# Pull pre-built image from GitHub Container Registry (no local build).
#
#   docker compose -f docker-compose.ghcr.yml --env-file config.env up -d
#   docker compose -f docker-compose.ghcr.yml down
#
# First time: package must be public at
#   https://github.com/users/trolle6/packages/container/fluxer-tts/settings
# (GitHub → Packages → fluxer-tts → Package settings → Change visibility)

services:
  fluxer-bot:
    image: ghcr.io/trolle6/fluxer-tts:latest
    container_name: fluxer-bot
    restart: unless-stopped
    environment:
      FLUXER_BOT_TOKEN: ${FLUXER_BOT_TOKEN}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      FLUXER_LOG_CHANNEL_ID: ${FLUXER_LOG_CHANNEL_ID:-}
      FLUXER_MODERATOR_ROLE_ID: ${FLUXER_MODERATOR_ROLE_ID:-}
      FLUXER_CHANNEL_ID: ${FLUXER_CHANNEL_ID:-}
      TTS_CHANNEL_ID: ${TTS_CHANNEL_ID:-}
      TTS_ROLE_ID: ${TTS_ROLE_ID:-}
      FLUXER_API_URL: ${FLUXER_API_URL:-}
      DEBUG_MODE: ${DEBUG_MODE:-false}
      SKIP_API_VALIDATION: ${SKIP_API_VALIDATION:-false}
      DATA_ROOT: /app/Data
      Tts__MaxQueueSize: ${MAX_QUEUE_SIZE:-50}
      Tts__RateLimitRequests: ${RATE_LIMIT_REQUESTS:-15}
      Tts__RateLimitWindowSeconds: ${RATE_LIMIT_WINDOW:-60}
      Tts__MaxAudioCacheEntries: ${MAX_TTS_CACHE:-50}
      Tts__AutoDisconnectTimeoutSeconds: ${AUTO_DISCONNECT_TIMEOUT:-300}
      Dalle__MaxCacheEntries: ${MAX_IMAGE_CACHE:-30}
    volumes:
      - ./data:/app/Data
